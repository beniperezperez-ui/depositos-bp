name: Actualizar Mercado Diariamente

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar rastreador de depósitos
      run: python buscar_depositos.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add *.csv *.txt 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Actualización automática del mercado" && git push)
